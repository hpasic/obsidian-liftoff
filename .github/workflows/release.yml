name: Release Obsidian Plugin

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re-)release"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Ensure .nvmrc exists (fallback for pre-.nvmrc tags)
        run: test -f .nvmrc || echo "25" > .nvmrc

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      # Before anything else, so a tag without a CHANGELOG.md section fails fast
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ -f scripts/changelog-notes.mjs ]; then
            node scripts/changelog-notes.mjs "$TAG" > "$RUNNER_TEMP/release-notes.md"
          else
            # Re-running a tag from before CHANGELOG.md existed (workflow_dispatch)
            echo "::notice::No scripts/changelog-notes.mjs at $TAG; using generated notes"
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ -f "$RUNNER_TEMP/release-notes.md" ]; then
              notes=(--notes-file "$RUNNER_TEMP/release-notes.md")
            else
              notes=(--generate-notes)
            fi
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              "${notes[@]}"
          fi
          gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            main.js manifest.json styles.css
